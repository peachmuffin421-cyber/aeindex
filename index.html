<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ÆI Seed - Fixed Offline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050510;color:#aaccff;font-family:'Courier New',monospace;overflow:hidden;height:100vh;width:100vw}
#connBadge{position:absolute;top:10px;right:10px;z-index:99;background:rgba(5,5,16,0.95);border:1px solid #00ff88;border-radius:4px;padding:6px 10px;font-size:0.7rem;color:#00ff88;cursor:pointer}
#connBadge.wait{border-color:#ffaa44;color:#ffaa44}
#connBadge.err{border-color:#ff4466;color:#ff4466}
#controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.tb-btn{background:rgba(20,30,50,0.9);border:1px solid #4488aa;color:#aaccff;padding:6px 12px;border-radius:4px;cursor:pointer;font-family:monospace;font-size:0.7rem}
.tb-btn:hover{background:#224466}
#grid{position:absolute;top:50px;left:0;right:0;bottom:80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:10px;overflow-y:auto}
.panel{background:rgba(10,15,30,0.9);border:1px solid #224466;border-radius:6px;padding:8px;font-size:0.6rem}
.panel-title{color:#00ffcc;font-size:0.7rem;margin-bottom:4px}
.val{color:#44ffcc}
#errorDisplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);border:1px solid #ff4466;padding:20px;border-radius:8px;max-width:90%;display:none;z-index:100}
</style>
</head>
<body>
<div id="connBadge" class="ok">offline - ready (tap to clear LS)</div>
<div id="grid">
<div class="panel"><div class="panel-title">𝒮_STATUS</div><div>Backend: <span class="val" id="backendUrl">offline</span></div><div>Tick: <span class="val" id="tickVal">0</span></div><div>State: <span class="val">evolving (offline demo)</span></div></div>
<div class="panel"><div class="panel-title">𝒜_PRIMES</div><div class="val">2, 3, 5, 7, 11, 13, 17, 19...</div></div>
<div class="panel"><div class="panel-title">Λ₂₄_PACK</div><div>Leech lattice demo</div></div>
<div class="panel"><div class="panel-title">𝒮_FIB</div><div>Hopf S³→S²</div></div>
<div class="panel"><div class="panel-title">𝒯_s</div><div>step ready</div></div>
<div class="panel"><div class="panel-title">ℋ_LOGIC_CORE</div><div>offline mode</div></div>
</div>
<div id="controls">
<button class="tb-btn" onclick="location.href=location.pathname+'?backend=off'">Go Offline</button>
<button class="tb-btn" onclick="testBackend()">Test Backend</button>
<button class="tb-btn" onclick="clearLS()">Clear LS</button>
</div>
<div id="errorDisplay"></div>
<script>
'use strict';
const LS_KEY='aei_backend_url';
const DEFAULT_BACKEND='https://aei-37a29e073070.herokuapp.com/';
const badge=document.getElementById('connBadge');
const backendEl=document.getElementById('backendUrl');

function getParam(n){ try{ return new URLSearchParams(location.search).get(n); }catch(e){ return null; } }

function clearLS(){
  try{
    localStorage.removeItem(LS_KEY);
    localStorage.removeItem('aei_backend_url');
    localStorage.clear();
  }catch(e){}
  badge.textContent='LS cleared - reload';
  badge.className='ok';
  setTimeout(()=>location.href=location.pathname+'?backend=off',500);
}

badge.addEventListener('click', clearLS);

function normalize(u){
  if(!u) return '';
  let s=String(u).trim();
  if(s.toLowerCase()==='off' || s==='0') return '';
  try{ if(/%3A/.test(s)) s=decodeURIComponent(s); }catch(e){}
  if(!/^https?:\/\//i.test(s)) return '';
  return s.replace(/\/+$/,'') + '/';
}

function resolveBackend(){
  const qp=getParam('backend');
  if(qp!==null){
    if(qp.toLowerCase()==='off' || qp==='0'){
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      return '';
    }
    const n=normalize(qp);
    if(n){
      try{ localStorage.setItem(LS_KEY,n); }catch(e){}
      // clean url
      try{ const u=new URL(location.href); u.searchParams.delete('backend'); history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(e){}
      return n;
    }
    return '';
  }
  // No ?backend param -> OFFLINE by default to fix stuck connecting
  // Only use LS if ?forceOnline=1
  const force=getParam('forceOnline');
  if(force==='1'){
    try{
      const ls=localStorage.getItem(LS_KEY);
      const n=normalize(ls);
      if(n) return n;
    }catch(e){}
    return DEFAULT_BACKEND;
  }
  return '';
}

const BACKEND_URL=resolveBackend();
const HAS_BACKEND=!!BACKEND_URL;
backendEl.textContent=BACKEND_URL||'offline (use ?backend=URL&forceOnline=1 to go online)';

if(!HAS_BACKEND){
  badge.textContent='offline - ready (tap to clear LS)';
  badge.className='ok';
} else {
  badge.textContent='connecting to '+BACKEND_URL+'...';
  badge.className='wait';
  testBackend();
}

async function testBackend(){
  if(!HAS_BACKEND){
    // try with forceOnline if user clicked test
    const tryUrl=DEFAULT_BACKEND;
    badge.textContent='testing '+tryUrl+'...';
    badge.className='wait';
    try{
      const ctrl=new AbortController();
      const to=setTimeout(()=>ctrl.abort(),5000);
      const r=await fetch(tryUrl+'health',{signal:ctrl.signal});
      clearTimeout(to);
      if(r.ok){
        const j=await r.json();
        badge.textContent='connected - tick '+(j.seed_tick||0);
        badge.className='ok';
        backendEl.textContent=tryUrl+' (healthy)';
        document.getElementById('tickVal').textContent=j.seed_tick||'0';
      } else {
        badge.textContent='backend '+r.status+' - tap for offline';
        badge.className='err';
      }
    }catch(e){
      badge.textContent='timeout - Heroku sleeping? tap for offline';
      badge.className='err';
      backendEl.textContent='timeout: '+tryUrl;
    }
    return;
  }
  try{
    const ctrl=new AbortController();
    const to=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch(BACKEND_URL+'health',{signal:ctrl.signal});
    clearTimeout(to);
    if(r.ok){
      const j=await r.json();
      badge.textContent='connected - tick '+(j.seed_tick||0);
      badge.className='ok';
      backendEl.textContent=BACKEND_URL;
      document.getElementById('tickVal').textContent=j.seed_tick||'0';
    } else {
      badge.textContent='backend '+r.status+' - tap for offline';
      badge.className='err';
    }
  }catch(e){
    badge.textContent='network error - tap for offline';
    badge.className='err';
  }
}

console.log('ÆI Seed Fixed Offline - no auto backend fetch unless ?backend= or ?forceOnline=1');
console.log('To go online: ?backend=https://aei-37a29e073070.herokuapp.com/&forceOnline=1');
console.log('To clear poisoned LS: tap badge or ?backend=off');
</script>
</body>
</html>
